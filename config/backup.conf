# ---------- Storage Directories ----------
# Where backup archives will be stored
BACKUP_DIR="./backups"

# Where log files will be written
LOG_DIR="./logs"

# Default source directory to back up if none is passed via CLI argument
DEFAULT_SOURCE_DIR="$HOME/backup-test"

# Path to exclusion patterns file
EXCLUDE_FILE="./config/exclude.txt"

# ---------- Retention Policy ----------
# Backups older than this number of days will be deleted by cleanup.sh
RETENTION_DAYS=10

# Maximum number of backups to retain regardless of age (safety cap)
MAX_BACKUP_COUNT=30

# ---------- Integrity & Compression ----------
# Generate SHA256 checksum alongside each .tar.gz archive (true/false)
GENERATE_CHECKSUM=true

# Gzip compression level: 1 (fastest) to 9 (best compression)
COMPRESSION_LEVEL=6

# ---------- System Monitoring & Health Check ----------
# Maximum allowed disk usage percentage before health check triggers a warning
DISK_ALERT_THRESHOLD=85

# Maximum archive age in days before health check warns about missing recent backups
MAX_BACKUP_AGE_WARNING_DAYS=2

# ---------- Notifications & Webhooks (Optional) ----------
# Set to true to send webhook alerts to Slack, Discord, or custom webhook
WEBHOOK_NOTIFICATIONS_ENABLED=false

# Webhook endpoint URL (Discord, Slack, Teams, or Custom endpoint)
WEBHOOK_URL=""
